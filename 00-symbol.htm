	<meta content="light dark"name=color-scheme>
	<style>
	*{
		appearance:none;
		box-sizing:border-box;
		&::selection{background-color:light-dark(#BFDBFE,#404040)}}
	body{
		background-color:light-dark(#F5F5F5,#171717);
		margin          :0;}
	main{
		border-color:light-dark(#E5E5E5,#262626);
		border-style:none solid;
		border-width:1px;
		margin-left :auto;
		margin-right:auto;
		max-width   :80rem;
		min-height  :100dvh;}
	#code svg{display:block;margin:auto;max-width:100%;padding-top:0.5rem}
	@media(max-width:40rem){
		main{padding-bottom:4.5rem}}
	input{
		background-color          :transparent;
		color                     :light-dark(#404040,#D4D4D4);
		border-color              :light-dark(#E5E5E5,#262626);
		border-style              :none none solid none;
		border-width              :1px;
		font-family               :monospace;
		font-size                 :1rem;
		padding                   :0.8rem;
		transition-duration       :0.1s;
		transition-property       :border-color;
		transition-timing-function:ease-in-out;
		vertical-align            :top;
		width                     :100%;
		@media(max-width:40rem){
			position    :fixed;
			border-style:solid none none none;
			bottom      :0;}
		&:focus{outline-style:none}
		&:focus,&:hover{border-color:light-dark(#D4D4D4,#404040)}
		&:invalid{border-color:light-dark(#FECACA,#7f1d1d)!important;}
		&::placeholder{
			color      :light-dark(#737373,#525252);
			user-select:none;}}</style>

<main>
	<input
		inputmode  =numeric
		maxlength  =12
		minlength  =11
		pattern    =^\d{11,12}$
		placeholder=036000291452
		spellcheck =false
		title      ="11–12 digit number"
		type       =text>
	<div id=code></div>
	<script>
	const input=document.getElementsByTagName("input")[0];
	const host =document.getElementById("code");
	input.value=input.placeholder;
	input.addEventListener("paste",(event)=>{
		event.preventDefault();
		const paste =(event.clipboardData||window.clipboardData).getData("text");
		const parse =paste.replace(/\D/g,"");
		const start =input.selectionStart;
		const end   =input.selectionEnd;
		const value =input.value;
		input.value =value.substring(0,start)+parse+value.substring(end);
		const cursor=start+parse.length;
		input.setSelectionRange(cursor,cursor);
		render();});
	const W     =["3211","2221","2122","1411","1132","1231","1114","1312","1213","3112"];
	const CHECK =(d)=>(10-d.reduce((acc,digit,i)=>acc+digit*(i%2?1:3),0)%10)%10;
	const enc   =(code)=>[...code.slice(0,6)].flatMap(d=>[...W[d]].map(Number));
	const sbs   =(code)=>[1,1,1,...enc(code),1,1,1,1,1,...enc(code.slice(6)),1,1,1];
	const BARS  =(widths)=>{
		const out=[];let x=0,bar=0,odd=true;
		for(const w of widths){
			if(odd){bar++;out.push([x,w,bar<=4||(bar>=15&&bar<=16)||bar>=29?6:0])}
			x+=w;odd=!odd;}
		return out;};
	const text  =(code)=>{let s="",i=0;for(;i<6;i++)s+='<text font-family="monospace"font-size="11px"text-anchor="middle"x="'+(i?8+13+7*(i-1):7)+'"y="46">'+code[i]+"</text>";for(;i<12;i++)s+='<text font-family="monospace"font-size="11px"text-anchor="middle"x="'+(i<11?61+7*(i-6):104)+'"y="46">'+code[i]+"</text>";return s};
	const points=code=>BARS(sbs(code)).map(([x,w,g])=>"<rect x=\""+(x+8)+"\" width=\""+w+"\" height=\""+(30+g)+"\"/>").join("");
	const svg   =code=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 111 50" role="img" aria-label="UPC-A '+code+'"><g fill="currentColor">'+points(code)+text(code)+"</g></svg>";
	const cache =new Map();
	const UPC_A =number=>{
		const d=String(number);
		let out=cache.get(d);
		if(out===undefined){
			out="";
			if(/^\d{11,12}$/.test(d)){
				const c=CHECK(d.slice(0,11).split("").map(Number));
				if(d.length<12||+d[11]===c)out=svg(d.slice(0,11)+c);}}
		cache.set(d,out);
		return out;};
	const render =()=>{host.innerHTML=UPC_A(input.value);input.setCustomValidity(/^\d{12}$/.test(input.value)&&!UPC_A(input.value)?"Invalid check digit":"");};
	input.addEventListener("input",render);
	render();
		</script>
